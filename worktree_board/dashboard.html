<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>worktree board</title>
<link rel="icon" href="data:,">
<script>/* 選んだ画面の色を、描く前に当てる（自動のときは OS の設定に任せる） */
try { const t = JSON.parse(localStorage.getItem('theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<style>
:root{
  /* 役目ごとの色。light-dark() の左が明るい表示、右が暗い表示。既定は OS の設定に合わせ、右上で選ぶと data-theme で固定する */
  color-scheme:light dark;
  --bg:light-dark(#fff,#1a1a1a);--col:light-dark(#f2f2f2,#000);--line:light-dark(#949494,#767676);
  --text:light-dark(#1a1a1a,#e6e6e6);--sub:light-dark(#666,#999);
  --accent:light-dark(#0017c1,#9db7f9);--accent-soft:light-dark(#e8f1fe,#00234b);--on-accent:light-dark(#fff,#000);
  --danger:light-dark(#ce0000,#ff9696);--danger-soft:light-dark(#fdeeee,#620000);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP","Noto Sans",sans-serif;
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--sans)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px}
h1{margin:0;font-size:20px;line-height:1.4}
.repo{color:var(--sub);overflow-wrap:anywhere}
.meta{margin-inline-start:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.stamp{color:var(--sub)}
.stamp.stale{color:var(--danger);font-weight:700}
button.refresh{height:36px;padding:0 16px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);color:var(--accent);font:inherit;font-weight:700;cursor:pointer}
button.refresh:hover{background:var(--accent-soft)}
button.refresh:disabled{border-color:var(--line);color:var(--sub);cursor:default;background:var(--col)}
.theme{display:flex}
.theme button{padding:0 10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:12px;line-height:26px;cursor:pointer}
.theme button:first-child{border-start-start-radius:6px;border-end-start-radius:6px}
.theme button:last-child{border-start-end-radius:6px;border-end-end-radius:6px}
.theme button + button{margin-inline-start:-1px}
.theme button:hover{background:var(--accent-soft)}
.theme button[aria-pressed="true"]{position:relative;border-color:var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;cursor:default}
select.lang{height:30px;max-width:11em;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;font-size:13px}
.alert{margin:0 16px 8px;padding:8px 12px;border:1px solid var(--danger);border-radius:8px;background:var(--danger-soft);color:var(--danger);white-space:pre-line;overflow-wrap:anywhere}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px;padding:4px 16px 16px;align-items:start}
.col{border-radius:12px;background:var(--col)}
.col:first-child{background:var(--accent-soft)}
.col.agent .card{border-inline-start:4px solid var(--accent)}
.col h2{display:flex;align-items:center;gap:8px;margin:0;padding:12px 12px 8px;font-size:16px}
.count{min-width:24px;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:14px;font-weight:400;line-height:22px;text-align:center}
.list{display:flex;flex-direction:column;gap:8px;padding:0 8px 8px}
.none{margin:0;padding:0 12px 12px;color:var(--sub)}
.card{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.top{display:flex;align-items:baseline;gap:8px}
.label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.age{flex:none;margin-inline-start:auto;color:var(--sub);font-variant-numeric:tabular-nums}
.title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.reason{margin-top:4px;color:var(--sub)}
.next{margin-top:2px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{padding:0 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;line-height:20px}
</style>
</head>
<body>
<header>
  <h1>worktree board</h1><span id="repo" class="repo" dir="ltr"></span>
  <div class="meta">
    <span id="stamp" class="stamp"></span>
    <button type="button" id="refresh" class="refresh" data-i18n="ui.refresh"></button>
    <div id="theme" class="theme" role="group" data-i18n-aria="ui.theme">
      <button type="button" data-scheme="auto" data-i18n="ui.theme_auto"></button><button type="button" data-scheme="light" data-i18n="ui.theme_light"></button><button type="button" data-scheme="dark" data-i18n="ui.theme_dark"></button>
    </div>
    <select id="lang" class="lang" data-i18n-aria="ui.language"></select>
  </div>
</header>
<p id="alert" class="alert" role="alert" hidden></p>
<main id="board" aria-live="polite"></main>
<script>
(() => {
  const STALE_MIN = 5;  // 見直しは 1 分おき。これより古い更新の時刻は、見張りが止まっているとして赤く出す
  const POLL_SEC = 10;  // エージェントの会話の様子は、サーバーが読むたびに新しくなるので、PR の見直しより短い間隔で取り直す
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  let data = null, refreshing = false;
  let locales = [], base = {}, msgs = {}, lang = 'en';

  // ---- 翻訳 ----
  // 文中の {名前} を引数で置き換える。引数が配列なら list.sep でつなぐ（サーバーの i18n.fmt と同じ規則）
  function fmt(table, key, args = {}) {
    const sep = table['list.sep'] ?? ', ';
    return (table[key] ?? base[key] ?? key).replace(/\{(\w+)\}/g, (m, n) => {
      const v = args[n];
      return v == null ? m : Array.isArray(v) ? v.join(sep) : String(v);
    });
  }
  const t = (key, args) => fmt(msgs, key, args);
  // カードの理由・次にすること・印の 1 つ。プラグインが書いた文（text）はそのまま、翻訳のキー（key）は今の言語に直す
  const say = m => m == null ? '' : m.text ?? t(m.key, m.args);

  // 言語の名前（ja_JP・zh-TW・pt-PT など）を、ある言語のコードに直す（サーバーの i18n.normalize と同じ規則）
  function normalize(tag) {
    const parts = String(tag || '').toLowerCase().split(/[-_]/);
    if (parts[0] === 'zh') return parts.includes('hant') || parts.slice(1).some(p => ['tw', 'hk', 'mo'].includes(p)) ? 'zh-Hant' : 'zh-Hans';
    return locales.find(l => l.code.toLowerCase() === parts[0])?.code ?? null;
  }
  const pickLanguage = () => {
    const saved = store.get('lang');
    if (locales.some(l => l.code === saved)) return saved;
    for (const tag of navigator.languages || [navigator.language]) { const c = normalize(tag); if (c) return c; }
    return 'en';
  };
  const getLocale = async code => (await fetch(`/locales/${code}.json`)).json();

  async function setLanguage(code) {
    msgs = code === 'en' ? base : {...base, ...await getLocale(code)};
    lang = code;
    document.documentElement.lang = code;
    document.documentElement.dir = msgs._dir || 'ltr';
    $('lang').value = code;
    document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach(e => e.setAttribute('aria-label', t(e.dataset.i18nAria)));
    $('lang').title = t('ui.language');
    if (data) render();
  }

  // ---- 時刻 ----
  function age(iso) {
    const m = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 60000));
    const [n, unit] = m < 60 ? [m, 'minute'] : m < 1440 ? [Math.floor(m / 60), 'hour'] : [Math.floor(m / 1440), 'day'];
    try { return new Intl.RelativeTimeFormat(lang, {numeric: 'always'}).format(-n, unit); } catch { return `${n} ${unit}`; }
  }
  function hhmm(iso) {
    try { return new Date(iso).toLocaleTimeString(lang, {hour: '2-digit', minute: '2-digit'}); } catch { return new Date(iso).toLocaleTimeString(); }
  }

  // ---- ボード ----
  function card(i) {
    const tag = i.url ? 'a' : 'div';
    const link = i.url ? ` href="${esc(i.url)}" target="_blank" rel="noopener"` : '';
    // repo が 2 つ以上のときだけ、どの repo のカードかを出す（OWNER/ は略す）
    const repo = data.repos.length > 1 ? [i.repo.split('/').pop()] : [];
    // 作業中・答え待ちは理由に出るので、印には返事を終えた（指示待ちの）会話だけを、エージェントごとに 1 つ足す
    const idle = [...new Set(i.agents.filter(a => a.status === 'idle').map(a => a.agent))].map(agent => t('agent.idle', {agent}));
    const chips = [...repo, ...(i.pr && i.label !== `PR #${i.pr}` ? [`PR #${i.pr}`] : []), ...i.badges.map(say), ...idle];
    return `<${tag} class="card"${link}>
      <span class="top"><span class="label" dir="auto">${esc(i.label)}</span>${i.updated_at ? `<span class="age" title="${esc(t('ui.age_title'))}">${esc(age(i.updated_at))}</span>` : ''}</span>
      <span class="title" dir="auto">${esc(i.title)}</span>
      <div class="reason">${esc(say(i.reason))}</div>${i.next ? `<div class="next">${esc(t('ui.next', {step: say(i.next)}))}</div>` : ''}
      ${chips.length ? `<span class="chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</span>` : ''}
    </${tag}>`;
  }

  function render() {
    $('repo').textContent = data.repos.map(r => r.repo).join(' · ');
    $('board').innerHTML = data.columns.map(({id: s, label}) => {
      const rows = data.worktrees.filter(i => i.state === s), name = label ?? t(`state.${s}`);
      return `<section class="col ${esc(s)}" aria-label="${esc(t('ui.column_label', {state: name, n: rows.length}))}">
        <h2>${esc(name)}<span class="count">${rows.length}</span></h2>
        ${rows.length ? `<div class="list">${rows.map(card).join('')}</div>` : `<p class="none">${esc(t('ui.none'))}</p>`}</section>`;
    }).join('');
    const mine = data.worktrees.filter(i => i.state === data.columns[0]?.id).length;  // 先頭の列（既定は「自分の番」）の枚数
    document.title = `${mine ? `(${mine}) ` : ''}worktree board`;
    const stale = !data.updated_at || Date.now() - Date.parse(data.updated_at) > STALE_MIN * 60000;
    $('stamp').textContent = !data.updated_at ? t('ui.never')
      : t(stale ? 'ui.updated_stale' : 'ui.updated', {time: hhmm(data.updated_at), min: STALE_MIN});
    $('stamp').classList.toggle('stale', stale);
    // 取れなかった repo ごとに 1 行。ほかの repo のカードはそのまま出す
    showAlert(data.repos.filter(r => r.error)
      .map(r => `${r.repo}: ${t('error.fetch', {detail: t(r.error.key, r.error.args)})}`).join('\n'));
    const busy = refreshing || data.checking;
    $('refresh').disabled = busy;
    $('refresh').textContent = t(busy ? 'ui.refreshing' : 'ui.refresh');
  }

  function showAlert(text) {
    $('alert').hidden = !text;
    $('alert').textContent = text || '';
  }

  async function load() {
    try {
      const r = await fetch('/api/worktrees', {cache: 'no-store'});
      if (!r.ok) throw new Error();
      data = await r.json();
    } catch {
      showAlert(t('ui.server_unreachable'));
      $('stamp').classList.add('stale');
      return;
    }
    render();
  }

  $('refresh').addEventListener('click', async () => {
    const before = data?.updated_at, started = Date.now();
    refreshing = true;
    $('refresh').disabled = true;
    $('refresh').textContent = t('ui.refreshing');
    try { await fetch('/api/refresh', {method: 'POST', headers: {'X-Dashboard': '1'}}); } catch { showAlert(t('ui.refresh_failed')); }
    const poll = async () => {
      await load();
      if ((data?.updated_at !== before && !data?.checking) || Date.now() - started > 120000) {
        refreshing = false;
        if (data) render();
      } else setTimeout(poll, 2000);
    };
    setTimeout(poll, 1500);
  });

  // ---- 画面の色 ----
  // 自動は OS の設定に合わせる。選んだものはこのブラウザに覚えさせ、読み込むときは <head> で先に当てる
  const themeBox = $('theme');
  function applyTheme(scheme) {
    scheme = scheme === 'light' || scheme === 'dark' ? scheme : 'auto';
    if (scheme === 'auto') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = scheme;
    themeBox.querySelectorAll('[data-scheme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.scheme === scheme)));
  }
  applyTheme(store.get('theme'));
  themeBox.addEventListener('click', e => {
    const b = e.target.closest('[data-scheme]');
    if (!b) return;
    if (b.dataset.scheme === 'auto') store.del('theme');
    else store.set('theme', b.dataset.scheme);
    applyTheme(b.dataset.scheme);
  });

  // ---- 言語 ----
  $('lang').addEventListener('change', e => { store.set('lang', e.target.value); setLanguage(e.target.value); });

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });

  (async () => {
    try {
      locales = await (await fetch('/api/locales')).json();
      base = await getLocale('en');
      $('lang').innerHTML = locales.map(l => `<option value="${esc(l.code)}" lang="${esc(l.code)}">${esc(l.name)}</option>`).join('');
      await setLanguage(pickLanguage());
    } catch {
      msgs = base = {'ui.server_unreachable': 'Cannot reach the server.'};
    }
    load();
    setInterval(() => { if (document.visibilityState === 'visible') load(); }, POLL_SEC * 1000);
  })();
})();
</script>
</body>
</html>
