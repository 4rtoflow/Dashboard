# テスト・静的検査・カバレッジ・画面の E2E。手元での流し方は AGENTS.md の「3. テンプレートを直す」。
name: CI

on:
  # 毎日 9:23（日本時間）。安定したら週 1 回にする（毎週月曜なら "23 0 * * 1"）。
  # 定期実行は main だけで走り、repo に 60 日動きが無いと GitHub が止める
  schedule:
    - cron: "23 0 * * *"
  # 試すとき（Actions の画面の Run workflow か、gh workflow run ci.yml）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t .

  old-python:
    # macOS に付いている /usr/bin/python3（3.9）で打たれても、版が足りないと出して止まる
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: |
          /usr/bin/python3 --version
          if /usr/bin/python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then
            echo "::notice::/usr/bin/python3 が 3.11 以上なので確かめない"
            exit 0
          fi
          set +e
          out=$(LANG=C /usr/bin/python3 -m worktree_board status 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          grep -q "Python 3.11 or later is needed" <<<"$out"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -c .github/ci-requirements.txt ruff mypy
      - run: ruff check --output-format=github .
      - run: mypy
      # この設定ファイル自体（中のシェルの書き方も shellcheck で見る）
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - run: shellcheck .github/notify-discord.sh

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -c .github/ci-requirements.txt coverage
      - run: coverage run -m unittest discover -s tests -t .
      # 表は実行の概要に出す。下限（pyproject.toml の fail_under）を下回ると、2 行目で落ちる
      - run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
          coverage report

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -c .github/ci-requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s e2e -t . -v

  notify:
    # 結果を Discord に送る。送り先は secret の DISCORD_WEBHOOK_URL（無ければ送らない）。
    # フォーラムの投稿に送るなら、その ID を variable の DISCORD_THREAD_ID に入れる
    needs: [test, old-python, lint, coverage, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: bash .github/notify-discord.sh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ vars.DISCORD_THREAD_ID }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
